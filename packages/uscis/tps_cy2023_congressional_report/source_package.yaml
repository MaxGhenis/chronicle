    measures:
      - measure_id: tps_beneficiaries_by_prior_status
        label: TPS beneficiaries by self-reported prior status at initial filing
        ordinal: 0
        column: E
        source_column_id: numeric_value
        expected_column_header_row: 1
        expected_column_header: numeric_value
        concept: uscis.tps_beneficiary_count_by_self_reported_prior_status
        source_concept: uscis.tps_cy2023.table_3.prior_status_frequency
        concept_relation: source_label
        concept_authority: uscis
        concept_evidence_url: >-
          https://www.uscis.gov/sites/default/files/document/reports/TPS_CY23_Congressional_Report.pdf
        concept_evidence_notes: >-
          USCIS Table 3 reports self-reported immigration status codes at the
          beneficiary's initial TPS filing. ASY means asylee, RE means refugee,
          and RE5 means Haitian with refugee status in the United States. These
          are code-specific historical overlaps, not current-status counts and
          not complete union totals for every refugee/asylee code. The much
          larger asylum-applicant categories (AS, AO, and 999) are deliberately
          excluded because they do not establish that asylum was granted.
        unit: count
        aggregation: sum
        expected_cell_type: number
