        concept_evidence_url: >-
          https://www.uscis.gov/sites/default/files/document/reports/TPS_CY23_Congressional_Report.pdf
        concept_evidence_notes: >-
          USCIS Table 2 reports the estimated number of TPS beneficiaries under
          each designated foreign state at the close of calendar year 2023.
          The report explicitly states that the counts include TPS holders who
          adjusted to lawful permanent resident status; no LPR exclusion should
          be imposed on these targets.
